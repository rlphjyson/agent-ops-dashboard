[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ops-backend"
version = "0.1.0"
description = "Backend for agent-ops-dashboard -- submits tasks to Claude-powered agents that call mcp-toolkit-ai's MCP servers, and relays their progress live"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "claude-agent-sdk>=0.2",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
