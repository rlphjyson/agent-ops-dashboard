name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # The sibling-directory auto-detection fallback assumes a real developer's local
      # `.../projects/agent-ops-dashboard` + `.../projects/mcp-toolkit-ai` layout, which doesn't
      # match how two repos get checked out into one CI workspace -- set this explicitly instead
      # of relying on that fallback here.
      MCP_TOOLKIT_PATH: ${{ github.workspace }}/mcp-toolkit-ai
    steps:
      - uses: actions/checkout@v5
        with:
          path: agent-ops-dashboard
      - uses: actions/checkout@v5
        with:
          repository: rlphjyson/mcp-toolkit-ai
          path: mcp-toolkit-ai
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install this repo's backend
        working-directory: agent-ops-dashboard/backend
        run: pip install -e ".[dev]"
      - name: Set up mcp-toolkit-ai's issue_tracker in its own .venv
        # The cross-repo e2e test spawns issue_tracker via the interpreter at
        # <MCP_TOOLKIT_PATH>/.venv/... (mcp_config.py's servers.toml "python" resolution
        # convention), so it needs a real venv there, not just the package importable from this
        # job's own Python.
        working-directory: mcp-toolkit-ai
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "servers/issue_tracker[dev]"
      - name: Lint
        working-directory: agent-ops-dashboard/backend
        run: ruff check .
      - name: Type check
        working-directory: agent-ops-dashboard/backend
        run: mypy app
      - name: Test
        working-directory: agent-ops-dashboard/backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
